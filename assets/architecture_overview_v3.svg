<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
<title id="title">bimanual-vla: End-to-End VLA Learning System</title>
<desc id="desc">Real Piper bimanual collection with Quest VR and RECAP, real-robot OpenPI SFT and RECAP training, simulation LIBERO and RoboTwin SFT and RLinf reinforcement learning, real-time Piper deployment, and unified data and experiment management dashboard.</desc>
